name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 配置缓存会让 testDebugUnitTest 挂起，必须显式关闭
  GRADLE_ARGS: --console=plain --no-configuration-cache --stacktrace

jobs:
  test:
    name: 构建与单测
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      # 默认 accept-android-sdk-licenses: true；这里先把 37 平台装上（新版 SDK 目录名是
      # android-37.0），装不到就交给 AGP 自动下载，避免 build-tools/platform 版本猜错
      - name: 补齐 SDK Platform 37
        run: |
          set -euo pipefail
          PKGS=$(sdkmanager --list 2>/dev/null | grep -oE 'platforms;android-37[^ |]*' | sort -u || true)
          if [ -n "$PKGS" ]; then
            echo "安装: $PKGS"
            sdkmanager $PKGS
          else
            echo "SDK 仓库未列出 37 平台包，交由 AGP 自动下载"
          fi

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # OneDrive 客户端 ID 是公开的 PKCE 客户端 ID，但按仓库惯例不入库；未配置时留空，
      # 应用的 OneDriveAuth.isConfigured() 会据此禁用登录入口
      - name: 注入可选本地配置
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        run: |
          if [ -n "${ONEDRIVE_CLIENT_ID:-}" ]; then
            printf 'ONEDRIVE_CLIENT_ID=%s\n' "$ONEDRIVE_CLIENT_ID" > local.properties
          fi

      - name: 单元测试 + 构建 debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug $GRADLE_ARGS

      # 只传 universal 包：debug 未压缩，5 个 ABI 包合计近 500MB，而 universal 一份就能在任何设备/模拟器安装
      - uses: actions/upload-artifact@v7
        with:
          name: tessera-debug-apk
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: 签名 Release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: 补齐 SDK Platform 37
        run: |
          set -euo pipefail
          PKGS=$(sdkmanager --list 2>/dev/null | grep -oE 'platforms;android-37[^ |]*' | sort -u || true)
          if [ -n "$PKGS" ]; then
            echo "安装: $PKGS"
            sdkmanager $PKGS
          else
            echo "SDK 仓库未列出 37 平台包，交由 AGP 自动下载"
          fi

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # 密钥经 Secrets 注入：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      - name: 写入签名与可选本地配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少仓库 Secret：$name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          if [ -n "${ONEDRIVE_CLIENT_ID:-}" ]; then
            printf 'ONEDRIVE_CLIENT_ID=%s\n' "$ONEDRIVE_CLIENT_ID" > local.properties
          fi

      - name: 构建签名 release APK
        run: ./gradlew :app:assembleRelease $GRADLE_ARGS

      - name: 校验签名
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -2
          done

      # ABI 拆分后产物为 app-<abi>-release.apk（含 app-universal-release.apk），
      # 统一改名成 Tessera-<tag>-<abi>.apk 再挂到 Release
      - name: 归档产物并创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            abi=${base#app-}
            abi=${abi%-release.apk}
            cp "$apk" "dist/Tessera-${{ github.ref_name }}-$abi.apk"
          done
          ls -lh dist
          gh release create "${{ github.ref_name }}" dist/*.apk \
            --title "${{ github.ref_name }}" \
            --generate-notes

      # 崩溃堆栈反混淆用；保留 90 天便于对照线上问题
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90
